<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>caseUNC — Report</title>
  <meta name="description" content="caseUNC executor capability report" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0f14'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' font-size='28' fill='%2356d364' font-family='monospace'%3EcU%3C/text%3E%3C/svg%3E" />
  <style>
    /* report-only page tweaks: hide decoder / marketing chrome from main page markup */
    body.report-only { padding-top: 0; }
    body.report-only main { padding-top: 1rem; }
    body.report-only .panel { margin-top: 0; }
    body.report-only #viewer > h2,
    body.report-only #viewer > p.muted,
    body.report-only #viewer textarea,
    body.report-only #viewer .cta-row.parse-cta { display: none !important; }
    body.report-only .top { border-bottom: 1px solid var(--border); }
    body.report-only footer { display: block; }
    #report-loading, #report-error {
      padding: 3rem 1rem;
      text-align: center;
      font-family: var(--mono);
      color: var(--muted);
      font-size: 0.95rem;
    }
    #report-error { color: var(--bad); }
    #report-error a { color: var(--accent-2); }
  </style>
</head>
<body class="report-only">
  <div class="bg"></div>
  <header class="top" id="topBar">
    <div class="brand">
      <span class="logo">caseUNC</span>
      <span class="tag">report view</span>
    </div>
    <nav>
      <a href="index.html">← Back to viewer</a>
    </nav>
  </header>

  <main>
    <div id="report-loading">Loading report…</div>
    <div id="report-error" hidden></div>

    <section id="viewer" class="panel" hidden>
      <h2>Report viewer</h2>
      <p class="muted">Paste a caseUNC base64 report payload.</p>
      <textarea id="reportInput" placeholder="Paste base64 report code..."></textarea>
      <div class="cta-row parse-cta">
        <button id="parseBtn" class="btn primary">Decode &amp; verify</button>
        <button id="clearBtn" class="btn ghost">Clear</button>
      </div>
      <div class="share-bar" id="shareBar" hidden>
        <span class="share-label" id="shareLabel">🔗 Short link:</span>
        <input id="shareUrl" type="text" readonly />
        <button id="copyShareBtn" class="btn primary small">Copy link</button>
        <button id="openMainBtn" class="btn ghost">Open in main viewer</button>
      </div>
      <div class="share-meta" id="shareMeta" hidden>
        <span class="key-chip" id="shareKey" hidden></span>
        <span class="muted" id="shareNote"></span>
      </div>
      <div id="status" class="status" hidden></div>
      <div id="reportView" class="report" hidden>
        <div class="stats">
          <div class="stat"><div class="label">Executor</div><div class="value" id="stExec">—</div></div>
          <div class="stat"><div class="label">Score</div><div class="value" id="stRate">—</div></div>
          <div class="stat"><div class="label">Passed</div><div class="value ok" id="stPass">—</div></div>
          <div class="stat"><div class="label">Failed</div><div class="value bad" id="stFail">—</div></div>
          <div class="stat"><div class="label">Spoof risk</div><div class="value" id="stRisk">—</div></div>
          <div class="stat"><div class="label">Seal</div><div class="value" id="stSeal">—</div></div>
        </div>
        <div class="meta-grid" id="metaGrid"></div>
        <div class="filters">
          <input id="filterText" type="search" placeholder="Filter tests..." />
          <select id="filterStatus">
            <option value="all">All statuses</option>
            <option value="pass">Pass</option>
            <option value="fail">Fail</option>
            <option value="skip">Skip</option>
          </select>
          <select id="filterCat">
            <option value="all">All categories</option>
          </select>
        </div>
        <div id="findings" class="findings"></div>
        <div id="results" class="results"></div>
      </div>
    </section>
  </main>

  <footer>
    <span>caseUNC · MIT · not affiliated with Roblox Corporation</span>
  </footer>

  <script src="assets/config.js"></script>
  <script src="assets/key.js"></script>
  <script src="assets/share.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
